<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADM Digital — Gestion</title><link rel="icon" href="/logo.png"><link rel="apple-touch-icon" href="/logo.png">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@600;700&display=swap">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#14202C;--muted:#5A6878;--line:#E1E6EB;--acc:#1f6bff;--soft:#E6EEFF;--navy:#0d1b3e;--sky:#6eaaff;--ok:#1C7A52;--ok-s:#DFF2E8;--warn:#9A6500;--warn-s:#FBF0D3;--bad:#B3302A;--bad-s:#F9E0DD;--info:#2A5E9C;--info-s:#E0EAF7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.ar{font-family:Cairo,Inter,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
header{background:var(--navy);border-bottom:1px solid #1b2c5c;position:sticky;top:0;z-index:5;color:#fff}
header .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}header .btn:hover{border-color:var(--sky)}header .btn.on{background:var(--acc);border-color:var(--acc)}
.logo img{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px}
header .wrap{display:flex;align-items:center;gap:12px;height:62px}
.logo{font-weight:800;font-size:20px;white-space:nowrap}.logo i{font-style:normal;color:var(--sky)}.logo small{font-weight:600;color:#9db8e8;font-size:13px;margin-left:8px;border:1px solid rgba(157,184,232,.4);border-radius:999px;padding:2px 9px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9d0d7}.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}.btn.d{color:var(--bad);border-color:#efc5c1}.btn.d.f{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.ok{color:var(--ok);border-color:#bfe0cd}.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
h1{font-size:24px;margin:22px 0 4px}.lead{color:var(--muted);margin:0 0 18px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;text-align:left}
.kpi b{display:block;font-size:26px;font-weight:800}.kpi span{color:var(--muted);font-size:13px;font-weight:600}
.kpi[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 2px var(--soft)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.list{display:grid;gap:10px;margin-bottom:40px}
.acc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(220px,1.6fr) 1fr 1.1fr auto;gap:14px;align-items:center}
.acc.st-suspended{border-left:4px solid var(--warn)}.acc.st-banned{border-left:4px solid var(--bad)}.acc.st-expired{border-left:4px solid var(--warn)}.acc.st-trial{border-left:4px solid var(--info)}.acc.st-active{border-left:4px solid var(--ok)}
.nm{font-weight:700;font-size:16px}.em{color:var(--muted);font-size:13px;word-break:break-all}
.meta{font-size:13px;color:var(--muted);line-height:1.6}.meta b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.active{background:var(--ok-s);color:var(--ok)}.pill.trial{background:var(--info-s);color:var(--info)}.pill.expired{background:var(--warn-s);color:var(--warn)}.pill.suspended{background:var(--warn-s);color:var(--warn)}.pill.banned{background:var(--bad-s);color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.note{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 9px;margin-top:6px;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:50px 10px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.modal-bg{position:fixed;inset:0;background:rgba(20,32,44,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:22px}
.modal h3{margin:0 0 6px;font-size:19px}.modal p{color:var(--muted);margin:0 0 12px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
#login{max-width:400px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px}
#login h2{margin:0 0 4px}.err{background:var(--bad-s);color:var(--bad);border-radius:8px;padding:9px 12px;margin-top:12px;font-weight:600;font-size:14px}
.okm{background:var(--ok-s);color:var(--ok);border-radius:8px;padding:9px 12px;margin-top:12px;font-weight:600;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:30}
.lnk{background:none;border:0;color:var(--info);cursor:pointer;padding:0;text-decoration:underline;font-size:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.acc{grid-template-columns:1fr}.acts{justify-content:flex-start}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,1fr)}header .logo small{display:none}}
@media (max-width:640px){header .wrap{height:auto;flex-wrap:wrap;padding-top:8px;padding-bottom:8px;gap:8px}header .btn{padding:6px 10px;font-size:13px}.logo small{display:none}}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:40px}
.prod{background:#fff;border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:16px;padding:18px;text-align:left;cursor:pointer;display:block;width:100%}
.prod:hover{box-shadow:0 6px 20px rgba(0,0,0,.07)}.pi{font-size:34px}.pn{font-weight:800;font-size:20px;margin-top:6px}.ps{color:var(--muted);font-size:14px;margin-bottom:12px}
.pk{font-size:14px;color:var(--muted);line-height:1.9}.pk b{font-size:22px;color:var(--ink)}.nw{color:var(--ok);font-weight:700}
.tg{display:inline-block;border-radius:999px;padding:1px 9px;margin-right:6px;font-size:12px;font-weight:700}.tg.t{background:var(--info-s);color:var(--info)}.tg.a{background:var(--ok-s);color:var(--ok)}.tg.e{background:var(--warn-s);color:var(--warn)}
</style></head><body>
<header><div class="wrap"><div class="logo" id="home" style="cursor:pointer"><img src="/logo.png" alt="">ADM <i>Digital</i><small id="crumb">Mes logiciels</small></div><button class="btn" id="bBack" hidden>← Mes logiciels</button><div class="sp"></div><button class="btn" id="bSoft" hidden>💻 Logiciels</button><button class="btn" id="bSp" hidden>📣 Sponsoring</button><button class="btn" id="bFin" hidden>💰 Finances</button><button class="btn" id="bSet" hidden>⚙ Réglages</button><button class="btn" id="bOut" hidden>Déconnexion</button></div></header>
<main class="wrap" id="app"></main>
<div id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://bkpjgxsbkveyxeacktev.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrcGpneHNia3ZleXhlYWNrdGV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4MTM5MTIsImV4cCI6MjEwOTM4OTkxMn0.0DeKYxtpUp8BaInXpJ5GrGEcTMjHBYXz1SgvZThrvRc';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'lp-admin-auth'}});
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;const toast=t=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3000)};
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const ago=d=>{if(!d)return 'jamais';const m=(Date.now()-new Date(d))/60000;if(m<60)return 'il y a '+Math.max(1,Math.round(m))+' min';const h=m/60;if(h<24)return 'il y a '+Math.round(h)+' h';const j=h/24;return 'il y a '+Math.round(j)+' j'};
const days=d=>Math.ceil((new Date(d)-Date.now())/86400000);
/* ---------- mes logiciels : ajouter un logiciel = ajouter une ligne ici ---------- */
const PRODUCTS=[
 {id:'auto',name:'ADM Auto',sub:'Location de voitures',icon:'🚗',color:'#C25E14',url:'https://admauto.vercel.app',fn:SB_URL+'/functions/v1/admin',key:SB_KEY,unit:['agence','agences'],price:'12 000 DA',data:'voitures, clients, contrats',login:'email'},
 {id:'carnet',name:'L’Carnet',sub:'الكارني · crédit des épiciers',icon:'📒',color:'#0F6E4F',url:'https://lcarnet.vercel.app',fn:'https://siibsjfmqpexkmsobynz.supabase.co/functions/v1/admin',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaWJzamZtcXBleGttc29ieW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MTgyMTgsImV4cCI6MjEwOTQ5NDIxOH0.Ns63NhK5YxuBjU1HxLvMzio2k3CTJZ5OJ5GT0YYsxYM',unit:['épicerie','épiceries'],price:'l\'abonnement annuel',data:'clients, crédits, paiements',login:'phone'},
];
let P=PRODUCTS[0];
const ready=p=>p.fn&&!p.fn.startsWith('__');
async function api(action,data={},prod){const p=prod||P;const{data:s}=await sb.auth.getSession();const tok=s.session?s.session.access_token:'';
  const r=await fetch(p.fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:p.key,Authorization:'Bearer '+tok},body:JSON.stringify({action,...data})});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
const state=a=>a.status==='banned'?'banned':a.status==='suspended'?'suspended':(a.expires_at&&new Date(a.expires_at)<new Date())?'expired':!a.expires_at||a.plan==='paid'?'active':'trial';
const LAB={active:'Abonné',trial:'En essai',expired:'Expiré',suspended:'Suspendu',banned:'Banni'};
const lab=a=>{const s=state(a);if(s==='expired')return a.plan==='paid'?'Abonnement expiré':'Essai terminé';if(s==='active'&&!a.expires_at)return 'Illimité';return LAB[s]};
const addYear=d=>{const b=d&&new Date(d)>new Date()?new Date(d):new Date();b.setFullYear(b.getFullYear()+1);b.setHours(23,59,0,0);return b.toISOString()};
let ROWS=[],F='all',Q='',VIEW='home';

/* ---------- connexion ---------- */
function loginView(msg,ok,mode){$('#bSet').hidden=$('#bOut').hidden=$('#bFin').hidden=$('#bSoft').hidden=$('#bSp').hidden=true;
  const setup=mode==='setup';
  app.innerHTML=`<div id="login"><h2>${setup?'Créer mon accès admin':'Connexion administrateur'}</h2><p style="color:var(--muted);margin:0 0 6px">${setup?'Première fois : choisis ton mot de passe avec le code d\'installation.':'Réservé au propriétaire de la plateforme.'}</p>
  <form id="lf"><label>Email</label><input class="in" id="em" type="email" autocomplete="email" required>
  ${setup?'<label>Code d\'installation</label><input class="in" id="cd" autocomplete="off" required>':''}
  <label>Mot de passe${setup?' (8 caractères minimum)':''}</label><input class="in" id="pw" type="password" autocomplete="${setup?'new-password':'current-password'}" required>
  <button class="btn p" style="width:100%;margin-top:16px;padding:11px">${setup?'Créer mon accès':'Se connecter'}</button></form>
  <div style="margin-top:12px;text-align:center"><button class="lnk" id="sw">${setup?'← J\'ai déjà un mot de passe':'Première connexion ? Créer mon accès'}</button></div>
  ${msg?`<div class="${ok?'okm':'err'}">${esc(msg)}</div>`:''}</div>`;
  $('#sw').onclick=()=>loginView('',false,setup?'':'setup');
  $('#lf').onsubmit=async e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value;const b=e.target.querySelector('button');b.disabled=true;
    try{if(setup){await fetch(SB_URL+'/functions/v1/admin',{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY},body:JSON.stringify({action:'bootstrap',email:em,password:pw,code:$('#cd').value.trim()})}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error({code:'Code d\'installation incorrect ou déjà utilisé.',not_admin:'Cet email n\'est pas administrateur.',password:'Mot de passe trop court (8 caractères minimum).'}[d.error]||d.error)})}
      const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw new Error(/Invalid/.test(error.message)?'Email ou mot de passe incorrect.':error.message);
      boot()}catch(err){loginView(err.message,false,mode)}}}

/* ---------- accueil : mes logiciels ---------- */
async function home(){VIEW='home';navOn('soft');$('#bSet').hidden=true;$('#bBack').hidden=true;$('#bOut').hidden=false;$('#crumb').textContent='Mes logiciels';
  app.innerHTML=`<h1>Mes logiciels</h1><p class="lead">Clique sur un logiciel pour voir ses inscrits et gérer les abonnements.</p><div class="prods">${PRODUCTS.map(p=>`<button class="prod" data-p="${p.id}" style="--pc:${p.color}"><div class="pi">${p.icon}</div><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.sub)}</div><div class="pk" id="k-${p.id}">${ready(p)?'Chargement…':'⏳ En préparation'}</div></button>`).join('')}</div>`;
  app.querySelectorAll('.prod').forEach(b=>b.onclick=()=>{const p=PRODUCTS.find(x=>x.id===b.dataset.p);if(!ready(p))return toast('Ce logiciel n\'est pas encore branché.');P=p;F='all';Q='';history.pushState({p:p.id},'');load()});
  for(const p of PRODUCTS.filter(ready)){api('list',{},p).then(d=>{const c={active:0,trial:0,expired:0,suspended:0,banned:0};d.rows.forEach(a=>c[state(a)]++);const nw=d.rows.filter(a=>Date.now()-new Date(a.created_at)<7*864e5).length;
    const el=$('#k-'+p.id);if(el)el.innerHTML=`<b>${d.rows.length}</b> inscrit${d.rows.length>1?'s':''}${nw?` · <span class="nw">+${nw} cette semaine</span>`:''}<br><span class="tg t">${c.trial} en essai</span><span class="tg a">${c.active} abonnés</span>${c.expired?`<span class="tg e">${c.expired} expirés</span>`:''}`})
   .catch(e=>{if(/forbidden/.test(e.message)&&p.id==='auto'){sb.auth.signOut();loginView('Ce compte n\'a pas les droits administrateur.');return}const el=$('#k-'+p.id);if(el)el.textContent='⚠ '+e.message})}
}
window.onpopstate=()=>{if(VIEW!=='home'&&!document.querySelector('.modal-bg'))home()};
function navOn(w){$('#bFin').hidden=$('#bSoft').hidden=$('#bSp').hidden=false;$('#bFin').classList.toggle('on',w==='fin');$('#bSp').classList.toggle('on',w==='sp');$('#bSoft').classList.toggle('on',w==='soft')}window.navOn=navOn;
$('#bFin').onclick=()=>{navOn('fin');history.pushState({f:1},'');FIN.show('fin')};$('#bSp').onclick=()=>{navOn('sp');history.pushState({f:1},'');FIN.show('sp')};$('#bSoft').onclick=()=>home();
$('#home').onclick=()=>{if(VIEW!=='home')home()};$('#bBack').onclick=()=>home();

/* ---------- tableau ---------- */
async function load(){VIEW='list';$('#crumb').textContent=P.name;$('#bBack').hidden=false;app.innerHTML='<p style="padding:40px;text-align:center;color:var(--muted)">Chargement…</p>';
  try{const d=await api('list');ROWS=d.rows;$('#bSet').hidden=$('#bOut').hidden=false;render()}
  catch(e){if(/forbidden/.test(e.message)&&P.id==='auto'){await sb.auth.signOut();loginView('Ce compte n\'a pas les droits administrateur.')}else app.innerHTML=`<div class="err" style="margin:30px 0">Erreur : ${esc(e.message)} <button class="btn sm" onclick="load()">Réessayer</button></div>`}}
function render(){
  const c={all:ROWS.length,active:0,trial:0,expired:0,suspended:0,banned:0};ROWS.forEach(a=>c[state(a)]++);
  const nw=ROWS.filter(a=>Date.now()-new Date(a.created_at)<7*864e5).length;
  const list=ROWS.filter(a=>(F==='all'||state(a)===F)&&(!Q||[a.agency_name,a.email,a.phone,a.note].join(' ').toLowerCase().includes(Q)));
  const K=(k,l)=>`<button class="kpi" data-f="${k}" aria-pressed="${F===k}"><b>${c[k]}</b><span>${l}</span></button>`;
  app.innerHTML=`<h1>${P.icon} ${esc(P.name)} — inscrits</h1><p class="lead">${ROWS.length} ${ROWS.length>1?P.unit[1]:P.unit[0]} · ${nw} cette semaine · <a href="${P.url}" target="_blank" rel="noopener">${P.url.replace('https://','')}</a></p>
  <div class="kpis">${K('all','Tous')}${K('active','Abonnés')}${K('trial','En essai')}${K('expired','Expirés')}${K('suspended','Suspendus')}${K('banned','Bannis')}</div>
  <div class="bar"><input id="q" placeholder="Rechercher : nom, email, téléphone, note…" value="${esc(Q)}"><button class="btn" id="rf">↻ Actualiser</button></div>
  <div class="list">${list.length?list.map(row).join(''):`<div class="empty">${ROWS.length?'Aucun compte dans ce filtre.':`Aucun inscrit pour l\'instant. Dès qu\'un client crée son compte sur ${P.url.replace('https://','')}, il apparaît ici.`}</div>`}</div>`;
  app.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{F=b.dataset.f;render()});
  const q=$('#q');q.oninput=()=>{Q=q.value.trim().toLowerCase();const pos=q.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)};
  $('#rf').onclick=load;
  app.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,b.dataset.id));
}
function row(a){const s=state(a);const dl=a.expires_at?days(a.expires_at):null;const exp=a.expires_at?(s==='expired'?`terminé le <b>${fd(a.expires_at)}</b>`:`jusqu'au <b>${fd(a.expires_at)}</b> (${dl} j)${a.plan==='paid'&&dl<=30?' <b style="color:var(--warn)">⚠ à renouveler</b>':''}`):'<b>illimité</b>';
  return `<div class="acc st-${s}">
   <div><div class="nm ar" dir="auto">${esc(a.agency_name||'(sans nom)')}</div><div class="em">${P.login==='phone'?`📞 ${esc(a.phone||'')}${a.push?' · 🔔 notifs OK':' · 🔕 notifs off'}`:esc(a.email)+(a.phone?' · '+esc(a.phone):'')}</div>${a.note?`<div class="note">📝 ${esc(a.note)}</div>`:''}${a.dup?`<div class="note" style="background:var(--bad-s);color:var(--bad);font-weight:600">⚠ Possible doublon avec : ${esc(a.dup)}</div>`:''}</div>
   <div class="meta"><span class="pill ${s}">● ${lab(a)}</span><br>Accès : ${exp}<br>Inscrit le <b>${fd(a.created_at)}</b></div>
   <div class="meta">${P.id==='carnet'?`👤 <b>${a.customers||0}</b> clients · 📒 <b>${a.txs||0}</b> opérations<br>💰 Crédit en cours : <b>${Math.round(a.due||0).toLocaleString('fr-FR')} DA</b> · ${a.first_tx?'1er crédit le <b>'+fd(a.first_tx)+'</b>':'<b style="color:var(--warn)">⚠ aucun crédit saisi</b>'}<br>`:`🚗 <b>${a.cars||0}</b> voitures · 👤 <b>${a.clients||0}</b> clients<br>📄 <b>${a.contracts||0}</b> contrats (${a.active_contracts||0} en cours)<br>`}Dernière activité : <b>${ago(a.last_data&&a.last_data>a.created_at?a.last_data:a.last_sign_in)}</b>${a.members?`<br>👥 <b>${a.members}</b> associé${a.members>1?'s':''} : ${esc(a.member_names)}`:''}</div>
   <div class="acts">
    <button class="btn sm ok" data-a="year" data-id="${a.user_id}">💳 ${a.plan==='paid'?'Renouveler':'Abonner'} 12 mois</button>
    ${s==='active'||s==='trial'?`<button class="btn sm" data-a="trial" data-id="${a.user_id}">⏱ Accès</button><button class="btn sm d" data-a="suspend" data-id="${a.user_id}">Suspendre</button>`:''}
    ${s==='expired'?`<button class="btn sm ok" data-a="trial" data-id="${a.user_id}">⏱ Prolonger</button><button class="btn sm d" data-a="suspend" data-id="${a.user_id}">Suspendre</button>`:''}
    ${s==='suspended'||s==='banned'?`<button class="btn sm ok" data-a="activate" data-id="${a.user_id}">✓ Réactiver</button>`:''}
    ${s!=='banned'?`<button class="btn sm d" data-a="ban" data-id="${a.user_id}">⛔ Bannir</button>`:''}
    <button class="btn sm" data-a="pwd" data-id="${a.user_id}">🔑 Mot de passe</button>
    <button class="btn sm" data-a="edit" data-id="${a.user_id}">✏ Note</button>
    <button class="btn sm d" data-a="delete" data-id="${a.user_id}" title="Supprimer définitivement">🗑</button>
   </div></div>`}

/* ---------- actions ---------- */
function modal(html){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(m);m.onclick=e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()};return m}
async function upd(id,patch,msg){try{await api('update',{user_id:id,...patch});toast(msg);await load()}catch(e){toast('Erreur : '+e.message)}}
function act(a,id){const r=ROWS.find(x=>x.user_id===id);const nm=esc(r.agency_name||r.email);
  if(a==='activate')return confirmBox('Réactiver ce compte ?',`<b>${nm}</b> pourra de nouveau utiliser la plateforme avec toutes ses données.`,'Réactiver','p',()=>upd(id,{status:'active'},'Compte réactivé'));
  if(a==='suspend')return confirmBox('Suspendre ce compte ?',`<b>${nm}</b> ne pourra plus utiliser la plateforme : il verra un écran « compte suspendu » avec ton contact. Ses données sont gardées, tu peux le réactiver quand tu veux.`,'Suspendre','d f',()=>upd(id,{status:'suspended'},'Compte suspendu'));
  if(a==='ban')return confirmBox('Bannir ce compte ?',`<b>${nm}</b> ne pourra plus se connecter, et son email ne pourra plus créer de nouveau compte. Tu peux annuler plus tard avec « Réactiver ».`,'Bannir','d f',()=>upd(id,{status:'banned'},'Compte banni'));
  if(a==='year'){const nx=addYear(r.expires_at);return confirmBox(r.plan==='paid'?'Renouveler l\'abonnement ?':'Activer l\'abonnement 12 mois ?',`<b>${nm}</b> a payé ${P.price} : accès jusqu'au <b>${fd(nx)}</b>${r.expires_at&&new Date(r.expires_at)>new Date()?' (les jours restants sont gardés)':''}. À cette date, l'application se bloque toute seule et lui demande de renouveler.`,'Confirmer le paiement','p',()=>upd(id,{expires_at:nx,plan:'paid',status:'active'},`Abonné jusqu'au ${fd(nx)}`))}
  if(a==='delete'){const m=modal(`<h3>Supprimer définitivement ?</h3><p>Le compte de <b>${nm}</b> et <b>toutes ses données</b> (${P.data}) seront effacés. Impossible d'annuler.</p><label>Tape SUPPRIMER pour confirmer</label><input class="in" id="cf" autocomplete="off"><div class="row"><button class="btn" data-x>Annuler</button><button class="btn d f" id="go" disabled>Supprimer</button></div>`);
    const i=m.querySelector('#cf'),g=m.querySelector('#go');i.oninput=()=>g.disabled=i.value.trim().toUpperCase()!=='SUPPRIMER';g.onclick=async()=>{g.disabled=true;try{await api('delete',{user_id:id});m.remove();toast('Compte supprimé');load()}catch(e){toast('Erreur : '+e.message);g.disabled=false}};return}
  if(a==='trial'){const cur=r.expires_at?new Date(r.expires_at).toISOString().slice(0,10):'';
    const m=modal(`<h3>Durée d'accès</h3><p><b>${nm}</b> — actuellement : ${r.expires_at?'jusqu\'au '+fd(r.expires_at):'illimité'}. À la date de fin, le client voit « période d'essai terminée » avec ton contact (ses données restent).</p>
     <label>Ajouter à partir d'aujourd'hui</label><div class="chips">${[3,7,15,30,90,365].map(n=>`<button class="btn sm" data-d="${n}">+${n} j</button>`).join('')}</div>
     <label>Ou choisir la date de fin</label><input class="in" type="date" id="dt" value="${cur}">
     <div class="row"><button class="btn" data-x>Annuler</button><button class="btn" id="unl">Accès illimité (payé)</button><button class="btn p" id="sv">Enregistrer la date</button></div>`);
    const end=d=>{const x=new Date();x.setDate(x.getDate()+d);x.setHours(23,59,0,0);return x.toISOString()};
    m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{m.remove();upd(id,{expires_at:end(+b.dataset.d),status:r.status==='banned'?'banned':'active'},`Accès jusqu'au ${fd(end(+b.dataset.d))}`)});
    m.querySelector('#unl').onclick=()=>{m.remove();upd(id,{expires_at:null,plan:'paid',status:'active'},'Accès illimité activé')};
    m.querySelector('#sv').onclick=()=>{const v=m.querySelector('#dt').value;if(!v)return toast('Choisis une date');m.remove();upd(id,{expires_at:new Date(v+'T23:59:00').toISOString(),status:'active'},'Date enregistrée')};return}
  if(a==='pwd'){const gen=()=>{const c=P.login==='phone'?'0123456789':'abcdefghjkmnpqrstuvwxyz23456789';let x='';const r=crypto.getRandomValues(new Uint32Array(P.login==='phone'?6:8));for(const n of r)x+=c[n%c.length];return x};
    const m=modal(`<h3>Nouveau mot de passe</h3><p>Pour <b>${nm}</b> (${esc(r.email)}). Le client se connecte avec ce mot de passe, puis il peut le changer dans ⚙ الإعدادات → حسابي.</p>
     <label>Mot de passe (6 caractères minimum)</label><div style="display:flex;gap:6px"><input class="in" id="np" value="${gen()}" autocomplete="off" style="font-family:monospace;font-size:17px"><button class="btn" id="rg" title="Générer">↻</button></div>
     <div id="ok2"></div><div class="row"><button class="btn" data-x>Fermer</button><button class="btn p" id="sv">Enregistrer</button></div>`);
    const np=m.querySelector('#np');m.querySelector('#rg').onclick=()=>np.value=gen();
    m.querySelector('#sv').onclick=async()=>{const pw=np.value.trim();if(pw.length<6)return toast('6 caractères minimum');const b=m.querySelector('#sv');b.disabled=true;
      try{await api('set_password',{user_id:id,password:pw});
        const msg=P.login==='phone'?`الكارني — معلومات الدخول الجديدة:\nالرابط: ${P.url}\nالرقم: ${r.phone||''}\nالكود السري: ${pw}`:`${P.name} — معلومات الدخول الجديدة:\nالرابط: ${P.url}\nالبريد: ${r.email}\nكلمة المرور: ${pw}`;
        const wa=(r.phone||'').replace(/\D/g,'').replace(/^0/,'213');
        b.remove();np.readOnly=true;m.querySelector('#rg').remove();
        m.querySelector('#ok2').innerHTML=`<div class="okm">✔ Mot de passe enregistré. Envoie-le au client :</div><div class="row" style="justify-content:flex-start"><button class="btn" id="cp">📋 Copier le message</button>${wa?`<a class="btn ok" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}" style="text-decoration:none">💬 Envoyer sur WhatsApp</a>`:''}</div>`;
        m.querySelector('#cp').onclick=()=>{navigator.clipboard.writeText(msg).then(()=>toast('Message copié'),()=>toast('Copie impossible'))}}
      catch(e){toast('Erreur : '+e.message);b.disabled=false}};return}
  if(a==='edit'){const m=modal(`<h3>Infos du client</h3><label>Nom</label><input class="in ar" dir="auto" id="ag" value="${esc(r.agency_name)}">${P.login==='phone'?'':`<label>Téléphone</label><input class="in" id="ph" value="${esc(r.phone)}">`}<label>Note (privée)</label><textarea class="in" id="nt" rows="3" placeholder="Ex. a payé 12 000 DA le 10/11, à relancer…">${esc(r.note)}</textarea><div class="row"><button class="btn" data-x>Annuler</button><button class="btn p" id="sv">Enregistrer</button></div>`);
    m.querySelector('#sv').onclick=()=>{const p={agency_name:m.querySelector('#ag').value.trim(),note:m.querySelector('#nt').value.trim()};if(m.querySelector('#ph'))p.phone=m.querySelector('#ph').value.trim();m.remove();upd(id,p,'Infos enregistrées')}}
}
function confirmBox(t,msg,yes,cls,fn){const m=modal(`<h3>${t}</h3><p>${msg}</p><div class="row"><button class="btn" data-x>Annuler</button><button class="btn ${cls}" id="go">${yes}</button></div>`);m.querySelector('#go').onclick=()=>{m.remove();fn()}}

/* ---------- réglages ---------- */
$('#bSet').onclick=async()=>{let s={};try{s=(await api('settings_get')).settings}catch(e){return toast('Erreur : '+e.message)}
  const m=modal(`<h3>Réglages — ${esc(P.name)}</h3><p>Ce contact s'affiche aux clients dont le compte est suspendu ou dont l'essai est terminé.</p>
   <label>Numéro WhatsApp</label><input class="in" id="wa" value="${esc(s.contact_whatsapp)}" placeholder="0550 12 34 56">
   <label>Numéro de téléphone</label><input class="in" id="ph" value="${esc(s.contact_phone)}" placeholder="0550 12 34 56">
   ${P.id==='carnet'?`<label>Prix affiché dans l'appli</label><input class="in ar" dir="auto" id="pr" value="${esc(s.price_text||'')}" placeholder="3000 دج للعام">`:''}<label>Essai automatique pour les nouveaux comptes (jours)</label><input class="in" id="td" type="number" min="0" value="${esc(s.trial_days||0)}"><div style="font-size:13px;color:var(--muted);margin-top:4px">0 = pas de limite automatique (tu fermes les comptes toi-même).</div>
   <div class="row"><button class="btn" data-x>Annuler</button><button class="btn p" id="sv">Enregistrer</button></div>`);
  m.querySelector('#sv').onclick=async()=>{try{await api('settings_set',{settings:{contact_whatsapp:m.querySelector('#wa').value.trim(),contact_phone:m.querySelector('#ph').value.trim(),trial_days:String(Math.max(0,parseInt(m.querySelector('#td').value)||0)),...(m.querySelector('#pr')?{price_text:m.querySelector('#pr').value.trim()}:{})}});m.remove();toast('Réglages enregistrés')}catch(e){toast('Erreur : '+e.message)}}};
$('#bOut').onclick=async()=>{await sb.auth.signOut();loginView('Tu es déconnecté.',true)};

async function boot(){const{data}=await sb.auth.getSession();if(data.session)home();else loginView()}
boot();setInterval(()=>{const a=document.activeElement;if(VIEW==='list'&&!document.querySelector('.modal-bg')&&document.visibilityState==='visible'&&$('#q')&&!(a&&a.tagName==='INPUT'))load()},60000);
</script>
<script src="/fin.js?v=2"></script></body></html>
