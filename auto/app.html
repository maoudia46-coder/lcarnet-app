<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocaParc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#14202C;--muted:#5A6878;--line:#E1E6EB;
  --accent:#C25E14;--accent-soft:#FBEADC;--accent-ink:#FFFFFF;
  --ok:#1C7A52;--ok-soft:#DFF2E8;--warn:#9A6500;--warn-soft:#FBF0D3;--bad:#B3302A;--bad-soft:#F9E0DD;--info:#2A5E9C;--info-soft:#E0EAF7;
  --plate-bg:#FFFFFF;--plate-ink:#0E141A;--scrim:rgba(14,22,30,.45);
  --f-body:'Cairo',Tahoma,'Segoe UI',sans-serif;--f-plate:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-body);font-weight:700;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(20,32,44,.04)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px 2px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.brand b{font-family:var(--f-plate);font-size:28px;font-weight:700;letter-spacing:.02em;direction:ltr}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--muted);padding:8px 13px 10px;cursor:pointer;white-space:nowrap;font-weight:600;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{background:var(--bad);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;font-weight:700;line-height:18px}
.abar{display:flex;align-items:center;gap:10px;background:var(--bad);color:#fff;border:0;width:100%;padding:8px 14px;border-radius:10px;margin:4px 0 10px;font-weight:700;cursor:pointer;text-align:start;font-size:14px}
.abar.warn{background:var(--warn)}
.abar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abar b{background:rgba(255,255,255,.25);border-radius:12px;padding:0 10px;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.abar{animation:pulse 2s ease-in-out 3}@keyframes pulse{50%{filter:brightness(1.18)}}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
main{padding-block:22px 60px;display:grid;gap:22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:26px}
.head p{margin:2px 0 0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h3{font-size:18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h3 small{font-size:13px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface2);border-radius:12px;padding:14px 16px;display:grid;gap:2px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .v{font-size:32px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.info .v{color:var(--info)} .kpi.warn .v{color:var(--warn)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.plate{font-family:var(--f-plate);font-weight:700;font-size:15px;letter-spacing:.06em;background:var(--plate-bg);color:var(--plate-ink);border:1.5px solid var(--plate-ink);border-radius:4px;padding:0 6px;white-space:nowrap;display:inline-block;line-height:21px;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:20px;padding:1px 10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface2);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:grid}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:150px}
.row .t{font-weight:700}
.row .m{font-size:13px;color:var(--muted)}
.sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.acc{background:var(--accent)}
.empty{color:var(--muted);padding:12px 0;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 13px;cursor:pointer;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 12px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:start;font-size:13px;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:end}
tbody tr:hover td{background:var(--surface2)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.sm-m{color:var(--muted);font-size:12px}
.fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;cursor:pointer;text-align:start}
.car:hover{border-color:var(--muted);box-shadow:0 4px 14px rgba(20,32,44,.06)}
.car .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.car .nm{font-family:var(--f-plate);font-size:22px;font-weight:700;line-height:1.1;direction:ltr;unicode-bidi:isolate}
.car .sub{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end;font-variant-numeric:tabular-nums}
.car .foot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px}
.car .price{font-size:19px;font-weight:700}
.txt-bad{color:var(--bad);font-weight:700} .txt-warn{color:var(--warn);font-weight:700} .txt-ok{color:var(--ok)}
.plan th,.plan td{padding:0;border-inline-end:1px solid var(--line)}
.plan th.d{text-align:center;padding:6px 2px;min-width:56px;font-size:11px}
.plan th.d b{display:block;font-size:17px;color:var(--ink)}
.plan th.d.today{background:var(--accent-soft)} .plan th.d.today b{color:var(--accent)}
.plan td.cn,.plan th.cn{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;padding:8px 10px;min-width:140px;font-size:13px}
.plan th.cn{background:var(--surface2);z-index:2}
.plan td.cn div{font-weight:700;direction:ltr;text-align:end}
.plan td.cell{height:48px;cursor:pointer}
.plan td.cell:hover{background:var(--surface2)}
.plan td.cell.today{background:#FDF5EE}
.blk{margin:6px 3px;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.blk.en_cours{background:var(--info-soft);color:var(--info);border-inline-start:3px solid var(--info)}
.blk.reserve{background:var(--accent-soft);color:var(--accent);border-inline-start:3px solid var(--accent)}
.blk.retard{background:var(--bad-soft);color:var(--bad);border-inline-start:3px solid var(--bad)}
.blk.atelier{background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--line) 6px 8px);color:var(--muted);border-inline-start:3px solid var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block}
.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:800px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{font-size:20px}
.modal .mb{padding:18px;display:grid;gap:18px}
.modal .mf{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:none}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0;display:grid;gap:12px;min-width:0}
legend{font-weight:700;font-size:15px;padding:0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%;min-width:0;font-weight:400;font-size:15px}
label.f textarea{min-height:60px;resize:vertical}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;background:var(--surface2)}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.sum{background:var(--surface2);border-radius:10px;padding:12px 14px;display:grid;gap:4px;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-size:19px;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.alert{border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--info-soft);color:var(--info)} .alert.ok{background:var(--ok-soft);color:var(--ok)}
.hidden{display:none!important}
.doc{font-size:14px;display:grid;gap:14px}
.doc .dh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px}
.doc .dh h4{font-size:21px;margin:0}
.doc .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.doc .box{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.doc .box b.t{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.doc ol{margin:0;padding-inline-start:18px;color:var(--muted);font-size:13px;display:grid;gap:4px}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sign div{border:1px dashed var(--line);border-radius:8px;height:80px;padding:8px;font-size:12px;color:var(--muted)}
.guide{display:grid;gap:10px;max-width:860px}
.guide details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.guide summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:16px;list-style:none;display:flex;gap:10px;align-items:center}
.guide summary::-webkit-details-marker{display:none}
.guide summary .n{background:var(--accent);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.guide summary::after{content:"+";margin-inline-start:auto;color:var(--muted);font-size:20px}
.guide details[open] summary::after{content:"−"}
.guide .gb{padding:0 16px 16px;display:grid;gap:10px;line-height:1.9}
.guide .gb p{margin:0}
.guide ol,.guide ul{margin:0;padding-inline-start:22px;display:grid;gap:6px}
.guide .tip{background:var(--info-soft);color:var(--info);border-radius:10px;padding:10px 14px;font-weight:600}
.guide .warn{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.guide .k{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:0 8px;font-size:13px;font-weight:700}
.guide .kb{display:inline-block;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:0 8px;font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:60;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (max-width:700px){
  .brand b{font-size:24px}
  .brand span{display:none}
  .head h2{font-size:22px}
  .head .btn{width:100%}
  main{padding-block:16px 50px;gap:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:12px}
  .kpi .v{font-size:26px}
  .kpi:last-child:nth-child(odd){grid-column:1 / -1}
  .panel{padding:14px}
  .row .btn{width:100%}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap}
  .fleet{grid-template-columns:1fr}
  .tscroll:has(table.rt){border:0;background:transparent;overflow:visible}
  table.rt thead{display:none}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt tr{border:1px solid var(--line);border-radius:12px;padding:6px 0;margin-bottom:10px;background:var(--surface)}
  table.rt td{border:0;padding:4px 12px;padding-inline-start:118px;position:relative;white-space:normal;text-align:start;min-height:30px}
  table.rt td::before{content:attr(data-label);position:absolute;inset-inline-start:12px;top:5px;width:100px;color:var(--muted);font-size:12px;font-weight:600}
  table.rt td[data-label=""]{padding-inline-start:12px}
  table.rt td[data-label=""]::before{content:none}
  table.rt td.r{text-align:start}
  table.rt tbody tr:hover td{background:transparent}
  table.rt .acts .btn{flex:1}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-height:94vh;border-radius:16px 16px 0 0}
  .modal .mb{padding:14px}
  .modal .mf{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .modal .mf .btn{flex:1}
  .sign{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<script src="lang.js?v=1"></script>

<body>
<div class="chrome">
  <div class="wrap">
    <div class="top">
      <div class="brand"><b>Loca<i>Parc</i></b><span>وكالة كراء السيارات · الجزائر</span></div>
      <button class="btn primary" data-act="newContract">+ عقد جديد</button>
    </div>
    <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
    <button class="abar" id="abar" data-act="alerts" hidden></button>
  </div>
</div>
<main class="wrap" id="view"></main>
<div class="modal-bg" id="modal" hidden><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<script>
const D=86400000;
const T0=new Date();T0.setHours(12,0,0,0);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const rel=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=rel(0);
const diffDays=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/D);
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtN=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const money=n=>fmtN(n)+' دج';
const km=n=>fmtN(n)+' كم';
const ltr=s=>`<span class="ltr" dir="ltr">${esc(s)}</span>`;
const fdate=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `<span class="ltr" dir="ltr">${d}/${m}/${y}</span>`};
const JOURS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const JC=['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MOIS=['جانفي','فيفري','مارس','أفريل','ماي','جوان','جويلية','أوت','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const longDate=s=>{const d=new Date(s+'T12:00');return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`};
const FUEL=['فارغ','ربع','نصف','ثلاثة أرباع','ممتلئ'];
const ZONES=['الصدام الأمامي','الصدام الخلفي','الجانب الأيسر','الجانب الأيمن','غطاء المحرك','السقف','الزجاج الأمامي','العجلات','المرايا','الداخل والمقاعد'];
const ACCS=['البطاقة الرمادية','وثيقة التأمين','العجلة الاحتياطية','الرافعة والمفتاح','المثلث','السترة العاكسة','مطفأة الحريق','علبة الإسعافات'];
const VID='تغيير الزيت';

const active=id=>S.contracts.find(k=>k.carId===id&&k.status==='en_cours');
const carStatus=c=>active(c.id)?'loue':c.atelier?'entretien':'dispo';
const nbJ=(a,b)=>Math.max(1,diffDays(a,b));
const base=k=>nbJ(k.debut,k.fin)*k.prix;
const isOpen=k=>k.status==='en_cours'||k.status==='reserve';
const totalK=k=>base(k)+(k.oExtra||0)+(k.oAssur||0)+(k.supp||0);
const solde=k=>totalK(k)-(k.acompte||0);
const isLate=k=>k.status==='en_cours'&&k.fin<TODAY;
function overlaps(carId,d1,d2,except){
  return S.contracts.some(k=>{if(k.carId!==carId||!isOpen(k)||k.id===except)return false;
    const kf=isLate(k)?TODAY:k.fin;return !(kf<d1||k.debut>d2)});
}
function statusPill(k){
  if(k.status==='annule')return '<span class="pill mute">ملغى</span>';
  if(k.status==='reserve')return '<span class="pill acc">محجوز</span>';
  if(isLate(k))return `<span class="pill bad">متأخر ${diffDays(k.fin,TODAY)} يوم</span>`;
  if(k.status==='en_cours')return k.fin===TODAY?'<span class="pill warn">يرجع اليوم</span>':'<span class="pill info">مُؤجَّرة</span>';
  return k.paye===false?'<span class="pill bad">منتهي · غير مدفوع</span>':'<span class="pill mute">منتهي</span>';
}
const carPill=c=>({dispo:'<span class="pill ok">متاحة</span>',loue:'<span class="pill info">مُؤجَّرة</span>',entretien:'<span class="pill warn">في الورشة</span>'})[carStatus(c)];

function dueCls(date){const d=diffDays(TODAY,date);return d<0?'txt-bad':d<=RULES.joursAlerte?'txt-warn':''}
function dueTxt(date){const d=diffDays(TODAY,date);return d<0?`منتهي منذ ${-d} يوم`:d===0?'ينتهي اليوم':d<=RULES.joursAlerte?`بعد ${d} يوم (${fdate(date)})`:fdate(date)}
function vidTxt(c){const r=c.vidangeKm-c.km;return r<=0?`<span class="txt-bad">متجاوز بـ ${km(-r)}</span>`:r<=RULES.kmAlerte?`<span class="txt-warn">بعد ${km(r)}</span>`:`بعد ${km(r)}`}
function alerts(){
  const a=[];
  S.cars.forEach(c=>{
    const r=c.vidangeKm-c.km;
    if(r<=0)a.push({lvl:'bad',c,f:'vid',t:`تغيير الزيت متجاوز بـ ${km(-r)}`});
    else if(r<=RULES.kmAlerte)a.push({lvl:'warn',c,f:'vid',t:`تغيير الزيت بعد ${km(r)}`});
    [['ct','المراقبة التقنية'],['vignette','القسيمة (الفينيات)'],['assurance','التأمين']].forEach(([f,l])=>{
      if(!c[f])return;const d=diffDays(TODAY,c[f]);
      if(d<0)a.push({lvl:'bad',c,f,t:`${l} منتهية منذ ${-d} يوم`});
      else if(d===0)a.push({lvl:'bad',c,f,t:`${l} تنتهي اليوم`});
      else if(d<=RULES.joursAlerte)a.push({lvl:'warn',c,f,t:`${l} تنتهي بعد ${d} يوم`});
    });
  });
  return a.sort((x,y)=>(x.lvl==='bad'?0:1)-(y.lvl==='bad'?0:1));
}
function allAlerts(){
  const a=alerts();
  S.contracts.filter(isLate).forEach(k=>a.unshift({lvl:'bad',c:car(k.carId),f:'late',k,t:`تأخر ${cli(k.clientId).nom} في إرجاع السيارة بـ ${diffDays(k.fin,TODAY)} يوم`}));
  return a;
}
function alertRow(a){

  return `<div class="row"><span class="sev ${a.lvl}"></span><div class="grow"><div class="t">${plate(a.c)} ${cn(a.c)}</div><div class="m ${a.lvl==='bad'?'txt-bad':'txt-warn'}">${a.lvl==='bad'?'⛔ ':'⚠ '}${esc(a.t)}</div></div>${btn}</div>`;
}

function finance(){
  const m=TODAY.slice(0,7);const ks=S.contracts.filter(k=>k.status!=='annule'&&k.debut.slice(0,7)===m);
  const loy=ks.reduce((s,k)=>s+base(k),0),ext=ks.reduce((s,k)=>s+(k.oExtra||0)+(k.supp||0),0),ass=ks.reduce((s,k)=>s+(k.oAssur||0),0);
  const dep=S.maint.filter(x=>x.date.slice(0,7)===m).reduce((s,x)=>s+(+x.cout||0),0);
  const cau=S.contracts.filter(k=>k.status==='en_cours').reduce((s,k)=>s+(k.caution||0),0);
  const ca=loy+ext+ass,tax=Math.round(ca-ca/(1+RULES.tva));
  const L=(l,v,cls,sub)=>`<div><span>${l}${sub?` <small style="color:var(--muted)">${sub}</small>`:''}</span><span class="num ${cls||''}">${v}</span></div>`;
  return `<div class="sum">${L('الكراء',money(loy))}${L('الإضافات',money(ext),'','تأخير، كيلومترات، وقود…')}${L('التأمين',money(ass))}${L('الضرائب',money(tax),'','TVA 19%')}${L('المصاريف (الصيانة)','− '+money(dep),'txt-bad')}<div class="tot"><span>الربح الصافي</span><span class="num">${money(ca-tax-dep)}</span></div></div>
  <div class="sum" style="margin-top:10px">${L('الودائع (الضمانات المحتفظ بها)',money(cau),'','تُرجع للزبائن')}</div>`;
}
function stats(){
  const wk=addDays(TODAY,-7),m=TODAY.slice(0,7);
  const cnt=(f,st)=>S.contracts.filter(k=>f(k)&&(st==='retard'?isLate(k):k.status===st)).length;
  const fw=k=>k.debut>=wk&&k.debut<=addDays(TODAY,7),fm=k=>k.debut.slice(0,7)===m;
  const rows=[['محجوز','reserve','acc'],['مُؤجَّرة','en_cours','info'],['متأخر','retard','bad'],['تم','cloture','mute'],['إلغاء','annule','mute']];
  return `<div class="tscroll" style="border:0"><table><thead><tr><th>الحالة</th><th class="r">الأسبوع</th><th class="r">الشهر</th></tr></thead><tbody>${rows.map(([l,st,c])=>`<tr><td><span class="pill ${c}">${l}</span></td><td class="r num">${cnt(fw,st)}</td><td class="r num">${cnt(fm,st)}</td></tr>`).join('')}</tbody></table></div>`;
}

  return `${start}

    <div class="kpi"><span class="l">نسبة الاستغلال</span><span class="v">${occ}%</span><div class="bar"><i style="width:${occ}%"></i></div></div>
    <div class="kpi"><span class="l">مداخيل الشهر</span><span class="v">${fmtN(ca)}</span><span class="s">دج · ${mk.length} عقود</span></div>

    <section class="panel"><h3>🔔 التنبيهات <small>الزيت، المراقبة، القسيمة، التأمين · ${al.length}</small></h3>

    <section class="panel"><h3>مالية شهر ${MOIS[+TODAY.slice(5,7)-1]}</h3>${finance()}</section>
    <section class="panel"><h3>الكراء <small>حسب الحالة</small></h3>${stats()}
      <h3 style="margin-top:16px">الحجوزات القادمة <small>${upc.length}</small></h3><div class="list">${upc.map(k=>{const c=car(k.carId),p=cli(k.clientId);return `<div class="row"><div class="grow"><div class="t">${esc(p.nom)}</div><div class="m">${plate(c)} ${cn(c)} · ${fdate(k.debut)} ← ${fdate(k.fin)}</div></div><button class="btn sm" data-act="contract" data-id="${k.id}">عرض</button></div>`}).join('')||'<div class="empty">لا توجد حجوزات قادمة.</div>'}</div></section>

function moveRow(m){const c=car(m.carId);const L={sortie:['خروج','info'],entree:['دخول','ok'],atelier:['ورشة','warn'],retour_atelier:['خروج من الورشة','ok']}[m.type];
  return `<div class="row"><span class="pill ${L[1]}">${L[0]}</span><div class="grow"><div class="t">${plate(c)} ${cn(c)}</div><div class="m">${esc(m.note)}</div></div><span class="m num">${fdate(m.date)}</span></div>`}

function vPlan(){
  const narrow=window.innerWidth<700;
  const start=addDays(TODAY,narrow?-1:-3),N=narrow?10:17,days=[...Array(N)].map((_,i)=>addDays(start,i));
  const rows=S.cars.map(c=>{
    let cells='',i=0;
    const endOf=x=>isLate(x)?TODAY:x.fin;
    while(i<N){
      const d=days[i];
      const k=S.contracts.find(x=>x.carId===c.id&&isOpen(x)&&x.debut<=d&&endOf(x)>=d);
      if(k){let span=1;while(i+span<N&&k.debut<=days[i+span]&&endOf(k)>=days[i+span])span++;
        cells+=`<td colspan="${span}"><div class="blk ${isLate(k)?'retard':k.status}" data-act="contract" data-id="${k.id}">${esc(cli(k.clientId).nom)}</div></td>`;i+=span;continue}
      if(c.atelier&&d>=TODAY){let span=1;while(i+span<N&&!S.contracts.some(x=>x.carId===c.id&&isOpen(x)&&x.debut<=days[i+span]&&x.fin>=days[i+span]))span++;
        cells+=`<td colspan="${span}"><div class="blk atelier" data-act="car" data-id="${c.id}">في الورشة</div></td>`;i+=span;continue}
      cells+=`<td class="cell ${d===TODAY?'today':''}" data-act="newContract" data-car="${c.id}" data-date="${d<TODAY?TODAY:d}" title="عقد جديد"></td>`;i++;
    }
    return `<tr><td class="cn"><div>${esc(carName(c))}</div>${plate(c)}</td>${cells}</tr>`;
  }).join('');
  return `<div class="head"><div><h2>جدول السيارات</h2><p>اضغط على خانة فارغة لإنشاء عقد على هذه السيارة في ذلك اليوم.</p></div>
    <div class="legend"><span><i style="background:var(--info)"></i>مُؤجَّرة</span><span><i style="background:var(--accent)"></i>محجوزة</span><span><i style="background:var(--bad)"></i>متأخرة</span><span><i style="background:var(--muted)"></i>ورشة</span></div></div>
  <div class="tscroll"><table class="plan"><thead><tr><th class="cn">السيارة</th>${days.map(d=>{const dt=new Date(d+'T12:00');return `<th class="d ${d===TODAY?'today':''}">${JC[dt.getDay()]}<b>${dt.getDate()}</b></th>`}).join('')}</tr></thead><tbody>${rows||'<tr><td colspan="18" class="empty" style="padding:16px">لا توجد سيارات بعد — أضفها من صفحة السيارات.</td></tr>'}</tbody></table></div>`;
}

    onCar(s.value!==cur||!val('nc_prix'))};

function saveContract(){
  let cid=val('nc_cli');

  const carId=val('nc_car');if(!carId)return toast('اختر سيارة متاحة.');
  const d1=val('nc_d1'),d2=val('nc_d2'),op=optCalc(nbJ(d1,d2));
  const k={id:uid('k'),num:'LC-2026-'+String(++S.num).padStart(4,'0'),carId,clientId:cid,debut:d1,fin:d2,heure:val('nc_h'),prix:num('nc_prix'),kmJour:num('nc_kmj'),caution:num('nc_caution'),acompte:num('nc_acompte'),kmDepart:num('nc_km'),carbDepart:+val('nc_carb'),accs:checked('nc_acc'),dmgDepart:checked('nc_dmg'),obs:val('nc_obs'),opts:op.names,oExtra:op.x,oAssur:op.a,status:d1<=TODAY?'en_cours':'reserve'};
  S.contracts.push(k);

function retCalc(k){const date=val('rt_date')||TODAY,kmR=num('rt_km'),retard=Math.max(0,diffDays(k.fin,date)),parcouru=kmR-k.kmDepart,inclus=nbJ(k.debut,date)*(k.kmJour||RULES.kmJour),kmSup=Math.max(0,parcouru-inclus);
  const quarts=Math.max(0,k.carbDepart-(+val('rt_carb'))),carbF=quarts*RULES.prixQuart,rep=num('rt_rep'),autre=num('rt_autre');
  return {date,kmR,retard,parcouru,inclus,kmSup,quarts,carbF,rep,autre,kmOk:parcouru>=0,supp:retard*k.prix+kmSup*RULES.prixKm+carbF+rep+autre}}
function mReturn(id){const k=S.contracts.find(x=>x.id===id),c=car(k.carId),p=cli(k.clientId);
  openModal('استلام السيارة',`<div class="alert info">${ltr(k.num)} · <b>${esc(p.nom)}</b> · ${plate(c)} ${cn(c)} · خرجت في ${fdate(k.debut)} بعداد ${km(k.kmDepart)}، الوقود ${FUEL[k.carbDepart]}</div>

  <div class="g">${fld('تكاليف الإصلاح (دج)',inp('rt_rep','number',0))}${fld('مصاريف أخرى (دج)',inp('rt_autre','number',0))}</div>
  ${fld('الضمان',sel('rt_caution',[['rendre','إرجاع الضمان للزبون'],['retenir','الخصم من الضمان']],'rendre'))}</fieldset>
  <div class="sum" id="rt_sum"></div>`,
  `<button class="btn" data-act="close">إلغاء</button><button class="btn primary" data-act="doReturn" data-id="${id}">إغلاق العقد</button>`);

    ${op?`<div><span>الإضافات</span><span class="num">+ ${money(op)}</span></div>`:''}
    ${r.retard?`<div class="txt-bad"><span>تأخير ${r.retard} يوم × ${money(k.prix)}</span><span class="num">+ ${money(r.retard*k.prix)}</span></div>`:''}

    ${r.carbF?`<div><span>نقص الوقود (${r.quarts} ربع)</span><span class="num">+ ${money(r.carbF)}</span></div>`:''}
    ${r.rep+r.autre?`<div><span>إصلاحات ومصاريف</span><span class="num">+ ${money(r.rep+r.autre)}</span></div>`:''}
    <div><span>التسبيق المدفوع</span><span class="num">− ${money(k.acompte)}</span></div>
    <div class="tot"><span>الباقي للتحصيل</span><span class="num">${money(base(k)+op+r.supp-k.acompte)}</span></div>
    ${r.kmOk?'':'<div class="txt-bad">العداد عند الرجوع أقل من العداد عند الخروج.</div>'}`};

function doReturn(id){const k=S.contracts.find(x=>x.id===id),r=retCalc(k);if(!r.kmOk)return toast('تحقق من العداد عند الرجوع.');

  ${fld('الوقود',sel('ac_carbu',['بنزين','مازوت','GPL','هجين','كهربائي'],'بنزين'))}${fld('علبة السرعة',sel('ac_boite',['عادي','أوتوماتيك'],'عادي'))}
  ${fld('اللون',sel('ac_coul',COLORS,'أبيض'))}${fld('سعر اليوم (دج)',inp('ac_prix','number',5000))}</div>
  <fieldset><legend>🔔 للتنبيهات</legend><div class="g">
  ${fld('العداد الحالي (كم)',inp('ac_km','number',0))}${fld('تغيير الزيت القادم عند (كم)',inp('ac_vid','number',''))}${fld('تغيير الزيت كل (كم)',sel('ac_int',[['5000','5 000 كم'],['7500','7 500 كم'],['10000','10 000 كم'],['15000','15 000 كم']],'10000'))}
  ${fld('المراقبة التقنية حتى',inp('ac_ct','date',addDays(TODAY,365)))}${fld('القسيمة (الفينيات) حتى',inp('ac_vig','date',addDays(TODAY,365)))}${fld('التأمين حتى',inp('ac_ass','date',addDays(TODAY,365)))}</div>
  <p class="sm-m" style="margin:0">إذا تركت «تغيير الزيت القادم» فارغًا = العداد الحالي + المدة المختارة.</p></fieldset>`,
  `<button class="btn" data-act="close">إلغاء</button><button class="btn primary" data-act="saveNewCar">إضافة</button>`);
  const mk=document.getElementById('ac_marque'),md=document.getElementById('ac_modele');
  const onModel=()=>document.getElementById('ac_modele_tw').classList.toggle('hidden',md.value!==OTHER);
  mk.addEventListener('change',()=>{const b=mk.value;document.getElementById('ac_marque_tw').classList.toggle('hidden',b!==OTHER);
    md.innerHTML=b===OTHER?`<option value="${OTHER}">أخرى (اكتبها)</option>`:b?`<option value="">— اختر الطراز —</option>${BRANDS[b].map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join('')}<option value="${OTHER}">أخرى (اكتبها)</option>`:'<option value="">— اختر العلامة أولاً —</option>';onModel()});
  md.addEventListener('change',onModel);
}
function saveNewCar(){
  const marque=val('ac_marque')===OTHER?val('ac_marque_t'):val('ac_marque'),modele=val('ac_modele')===OTHER?val('ac_modele_t'):val('ac_modele');
  if(!marque||!modele||!val('ac_plaque'))return toast('العلامة والطراز والترقيم إجبارية.');
  const k=num('ac_km'),it=num('ac_int')||10000;S.cars.push({id:uid('c'),marque,modele,annee:num('ac_annee'),plaque:val('ac_plaque'),carbu:val('ac_carbu'),boite:val('ac_boite'),couleur:val('ac_coul')||'—',prix:num('ac_prix'),km:k,interval:it,vidangeKm:num('ac_vid')||k+it,assurance:val('ac_ass'),ct:val('ac_ct'),vignette:val('ac_vig'),atelier:false});
  save();closeModal();UI.tab='flotte';render();toast('تمت إضافة السيارة')}

function mAddMaint(o={}){if(!S.cars.length)return toast('أضف سيارة أولاً من صفحة السيارات.');const c0=car(o.car)||S.cars[0];
  openModal('تسجيل صيانة',`<div class="g">
  ${fld('السيارة',sel('mt_car',S.cars.map(c=>[c.id,carName(c)+' · '+c.plaque]),c0.id))}${fld('النوع',sel('mt_type',MTYPES,o.type||VID))}
  ${fld('التاريخ',inp('mt_date','date',TODAY))}${fld('العداد',inp('mt_km','number',c0.km))}${fld('التكلفة (دج)',inp('mt_cout','number',''))}${fld('الميكانيكي',inp('mt_gar','text',''))}</div>
  ${fld('ملاحظة',`<textarea id="mt_note"></textarea>`)}
  <div class="alert info" id="mt_info"></div>`,
  `<button class="btn" data-act="close">إلغاء</button><button class="btn primary" data-act="saveMaint">حفظ</button>`);
  const upd=()=>{const c=car(val('mt_car'));document.getElementById('mt_info').textContent=val('mt_type')===VID?`تغيير الزيت القادم سيكون عند ${fmtN(num('mt_km')+(c.interval||10000))} كم — ويظهر التنبيه قبله بـ 1500 كم.`:'ستُضاف العملية إلى سجل السيارة.'};
  document.getElementById('mt_car').addEventListener('change',()=>{set('mt_km',car(val('mt_car')).km);upd()});
  ['mt_type','mt_km'].forEach(i=>document.getElementById(i).addEventListener('input',upd));upd()}
function saveMaint(){const c=car(val('mt_car')),k=num('mt_km');S.maint.push({id:uid('m'),carId:c.id,date:val('mt_date'),type:val('mt_type'),km:k,cout:num('mt_cout'),garage:val('mt_gar'),note:val('mt_note')});
  if(k>c.km)c.km=k;if(val('mt_type')===VID)c.vidangeKm=k+(c.interval||10000);save();closeModal();render();toast('تم تسجيل الصيانة')}

function mAddClient(){openModal('زبون جديد',`<div class="g">${fld('الاسم واللقب *',inp('cl_nom','text',''))}${fld('الهاتف *',inp('cl_tel','tel',''))}${fld('رقم الرخصة *',inp('cl_permis','text',''))}${fld('تاريخ إصدار الرخصة',inp('cl_pd','date',''))}${fld('رقم بطاقة التعريف',inp('cl_cni','text',''))}${fld('العنوان',inp('cl_adr','text',''))}</div>`,
  `<button class="btn" data-act="close">إلغاء</button><button class="btn primary" data-act="saveClient">إضافة</button>`)}
function saveClient(){if(!val('cl_nom')||!val('cl_tel')||!val('cl_permis'))return toast('الاسم والهاتف ورقم الرخصة إجبارية.');
  S.clients.push({id:uid('p'),nom:val('cl_nom'),tel:val('cl_tel'),permis:val('cl_permis'),permisDate:val('cl_pd')||'2015-01-01',cni:val('cl_cni'),adresse:val('cl_adr'),blacklist:false,note:''});save();closeModal();render();toast('تمت إضافة الزبون')}

let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-kf],[data-ff],[data-jf]');if(!t)return;
  const d=t.dataset;
  if(d.tab){UI.tab=d.tab;try{history.replaceState(null,'','#'+d.tab)}catch(_){}render();try{window.scrollTo(0,0)}catch(_){}return}
  if(d.kf){UI.kf=d.kf;return render()} if(d.ff){UI.ff=d.ff;return render()} if(d.jf){UI.jf=d.jf;return render()}
  const A={close:closeModal,alerts:mAlerts,newContract:()=>mNewContract({car:d.car,date:d.date,client:d.client}),saveContract,start:()=>mStart(d.id),doStart:()=>doStart(d.id),
    return:()=>mReturn(d.id),doReturn:()=>doReturn(d.id),contract:()=>mContract(d.id),car:()=>mCar(d.id),saveCar:()=>saveCar(d.id),atelier:()=>toggleAtelier(d.id),
    addCar:mAddCar,saveNewCar,addMaint:()=>mAddMaint({car:d.car,type:d.type}),saveMaint,addClient:mAddClient,saveClient,
    blacklist:()=>{const p=cli(d.id);p.blacklist=!p.blacklist;if(p.blacklist&&!p.note)p.note='أُضيف يدويًا';save();render();toast(p.blacklist?'أُضيف الزبون إلى القائمة السوداء':'أُزيل الزبون من القائمة السوداء')},
    paid:()=>{S.contracts.find(k=>k.id===d.id).paye=true;save();render();toast('تم تسجيل الدفع')},
    cancel:()=>{S.contracts.find(k=>k.id===d.id).status='annule';save();closeModal();render();toast('تم إلغاء الحجز')}};
  if(A[d.act]){e.preventDefault();A[d.act]()}
});
M.addEventListener('click',e=>{if(e.target===M)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!M.hidden)closeModal()});
document.addEventListener('input',e=>{const q=e.target.dataset&&e.target.dataset.q;if(!q)return;UI[q]=e.target.value;render();const n=document.getElementById(q);if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)&&h!==UI.tab){UI.tab=h;render()}});
let rw=window.innerWidth;window.addEventListener('resize',()=>{if(UI.tab==='planning'&&(rw<700)!==(window.innerWidth<700))render();rw=window.innerWidth});

load();render();
try{if(allAlerts().length&&localStorage.getItem('lp-alert-day')!==TODAY){localStorage.setItem('lp-alert-day',TODAY);mAlerts()}}catch(e){if(allAlerts().length)mAlerts()}
</script>
<script src="x.js"></script>
</body>
