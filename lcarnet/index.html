const alive=a=>(a||[]).filter(x=>!x.del);
function bal(cid){let s=0;for(const t of alive(D.tx))if(t.c===cid)s+=t.t==='c'?t.a:-t.a;return s}
function lastTx(cid){let m=0;for(const t of alive(D.tx))if(t.c===cid&&t.d>m)m=t.d;return m}
const isF=c=>!!c&&c.k==='f';
function total(){let s=0;for(const c of alive(D.customers)){if(isF(c))continue;const b=bal(c.id);if(b>0)s+=b}return s}
function totalF(){let s=0;for(const c of alive(D.customers)){if(!isF(c))continue;const b=bal(c.id);if(b>0)s+=b}return s}

/* ---------- routeur ---------- */
let ROUTE={r:'home'};
function go(r){ROUTE=r;history.pushState(r,'');render()}
window.onpopstate=e=>{if($('.sheet')){closeSheet();history.pushState(ROUTE,'');return}ROUTE=e.state||{r:'home'};render()};

function pill(){const p=$('#sp');if(!p)return;if(!navigator.onLine){p.className='pill off';p.textContent='📴 بلا أنترنت · محفوظ في التيليفون'}else if(syncing||dirty){p.className='pill';p.textContent='⏳ يتسجّل…'}else{p.className='pill';p.textContent='☁ محفوظ'}}

function topbar(title,sub,back){return `<div class="top">${back?`<button class="ib" onclick="history.back()" aria-label="رجوع">→</button>`:`<img src="icon-192.png" alt="" style="width:40px;height:40px;border-radius:12px">`}<div class="ttl">${esc(title)}${sub?`<small>${esc(sub)}</small>`:''}</div><button class="pill" id="sp" onclick="K.syncInfo()"></button>${back?'':`<button class="ib" onclick="K.menu()" aria-label="القائمة">☰</button>`}</div>`}

function trialBanner(){
  if(!ACC)return'';const d=daysLeft();
  if(!ACC.active||ACC.status!=='active')return `<div class="banner x">⛔ حسابك موقوف. الكريدي تاعك محفوظ، تقدر تشوفو برك.<button onclick="K.contact()">اتصل بنا</button></div>`;
  if(d!==null&&d<=0)return `<div class="banner x">⏰ كمّلت التجربة. الكريدي تاعك محفوظ كامل — اشترك باش تزيد تسجّل.<button onclick="openAbo()">اشترك</button></div>`;
  if(ACC.plan!=='paid'&&d!==null)return `<div class="banner t">🎁 التجربة باطل: باقي لك <span class="num">${d}</span> ${d>10?'يوم':'أيام'}<button onclick="openAbo()">اشترك</button></div>`;
  if(ACC.plan==='paid'&&d!==null&&d<=15)return `<div class="banner w">🔔 اشتراكك يكمّل بعد <span class="num">${d}</span> أيام<button onclick="openAbo()">جدّد</button></div>`;
  if(ACC.plan==='paid'&&ACC.expires_at)return `<div class="banner g">✅ اشتراك سنوي مفعّل حتى <bdi dir="ltr" class="num">${new Date(ACC.expires_at).toLocaleDateString('fr-FR',{timeZone:'Africa/Algiers'})}</bdi></div>`;
  return'';
}

/* ---------- écrans ---------- */
let Q='',FILT='all';
function render(){
  if(!USER)return;
  document.body.classList.toggle('ro',!canWrite());
  if(ROUTE.r==='cust')return renderCust(ROUTE.id);
  const custs=alive(D.customers).map(c=>({...c,b:bal(c.id),l:lastTx(c.id)}));
  custs.sort((a,b)=>(b.b>0)-(a.b>0)||b.b-a.b||b.l-a.l);
  const q=Q.trim().toLowerCase();
  const hasF=custs.some(isF);if(!hasF)FILT='all';
  const base=FILT==='c'?custs.filter(c=>!isF(c)):FILT==='f'?custs.filter(isF):custs;
  const list=q?base.filter(c=>(c.n+' '+(c.p||'')).toLowerCase().includes(q)):base;
  const shop=(D.shop&&D.shop.name)||(ACC&&ACC.agency_name)||'الكارني';
  let h=topbar(shop,'كناش الكريدي');

  if(!custs.length){
    h+=`<div class="card empty"><div class="big">📒</div><h2>سجّل الكريدي تاع أول زبون</h2><p>زر واحد برك. ما تحتاج حتى حاجة أخرى.</p><button class="btn g" data-w onclick="K.newCust()">➕ زبون جديد + الكريدي تاعو</button></div>
    <div class="safe">
      <div><i>☁</i><span><b>محفوظ أوتوماتيك</b>كل حاجة تكتبها تتسجّل وحدها. حتى لو ضاع التيليفون، تدخل من تيليفون آخر وتلقى كلش.</span></div>
      <div><i>📴</i><span><b>يخدم بلا أنترنت</b>الكريدي يبان ديما، حتى بلا أنترنت. وكي ترجع الأنترنت يتسجّل وحدو.</span></div>
      <div><i>🔒</i><span><b>حسابك محمي</b>ما يدخلو حتى واحد غير بالرقم تاعك والكود السري.</span></div>
      <div><i>📤</i><span><b>نسخة في يدك</b>تقدر تطبع ولا تحمّل الكناش كامل وقتما حبيت.</span></div>
    </div>`;
  }else{
    const dueN=custs.filter(c=>c.b>0&&!isF(c)).length,fs=custs.filter(isF),dueF=fs.filter(c=>c.b>0).length;
    h+=`<div class="card tot"><div class="ic">💰</div><div><div class="lbl">الكريدي اللي برّا (عند ${fmt(dueN)} زبون)</div><div class="val">${da(total())}</div></div></div>${hasF?`<div class="card tot f"><div class="ic">🏭</div><div><div class="lbl">الفورنيسورات (الديون) · ${fmt(dueF)}</div><div class="val">${da(totalF())}</div></div></div><div class="fchips"><button class="${FILT==='all'?'on':''}" onclick="K.filt('all')">الكل</button><button class="${FILT==='c'?'on':''}" onclick="K.filt('c')">👤 الزبائن</button><button class="${FILT==='f'?'on':''}" onclick="K.filt('f')">🏭 الفورنيسورات</button></div>`:''}
    <input class="search" type="search" placeholder="🔎 ابحث على زبون…" value="${esc(Q)}" oninput="K.q(this.value)">
    <div id="cl">${list.map(c=>`<button class="cl" onclick="K.open('${c.id}')"><div class="av">${esc((c.n||'?').trim().charAt(0))}</div><div><div class="n">${esc(c.n)}${isF(c)?'<span class="tag">فورنيسور</span>':''}</div><div class="s">${c.l?'آخر حركة '+dstr(c.l).slice(0,10):'ما كاين حتى حركة'}</div></div><div class="m ${c.b>0?(isF(c)?'owe':'due'):c.b<0?'ok':'zero'}">${c.b===0?'خالص ✓':da(Math.abs(c.b))}${isF(c)&&c.b>0?'<div class="s">نسالو</div>':''}${c.b<0?(isF(c)?'<div class="s">خلّصت زايد</div>':'<div class="s">عندو عندك</div>'):''}</div></button>`).join('')||'<p class="hint" style="text-align:center">ما لقينا حتى زبون بهذا الاسم.</p>'}</div>`;
  }
  h+=`</div>${custs.length?`<button class="fab" onclick="K.newCust()">➕ زبون جديد</button>`:''}`;
  app.innerHTML=h;pill();

function renderCust(id){
  const c=alive(D.customers).find(x=>x.id===id);if(!c){ROUTE={r:'home'};return render()}
  const b=bal(id),F=isF(c);
  const txs=alive(D.tx).filter(t=>t.c===id).sort((a,b)=>b.d-a.d);
  let h=topbar(c.n,c.p||'',true)+`<div class="wrap">${trialBanner()}
  <div class="card cbal"><div class="l">${F?(b>0?'🏭 فورنيسور · نسالو (الدين اللي عليّا)':b<0?'🏭 فورنيسور · خلّصتو زايد':'🏭 فورنيسور · خالص، ما نسالو والو'):(b>0?'عليه كريدي':b<0?'عندو عندك (دفع زايد)':'خالص، ما عليه والو')}</div><div class="v ${b>0?(F?'owe':'due'):b<0?'ok':'zero'}">${da(Math.abs(b))}</div></div>
  <div class="row2" style="margin-top:12px" data-w><button class="btn r" onclick="K.entry('${id}','c')">${F?'➕ دين (خذيت بالكريدي)':'➕ كريدي'}</button><button class="btn g" onclick="K.entry('${id}','p')">${F?'➖ خلّصتو':'➖ خلّص'}</button></div>
  <div class="row2" style="margin-top:10px">${F?'':`<button class="btn wa" onclick="K.wa('${id}')">📲 تذكير واتساب</button>`}<button class="btn l" onclick="K.statement('${id}')">🧾 كشف الحساب</button></div>
  <div class="card hist"><h3>التاريخ (${fmt(txs.length)} حركة)</h3>${txs.map(t=>`<div class="tx"><div class="k ${t.t==='c'?'c':'p'}">${t.t==='c'?'+':'−'}</div><div><div style="font-weight:700">${t.t==='c'?(F?'دين':'كريدي'):(F?'خلّصتو':'خلّص')}${t.n?' · '+esc(t.n):''}</div><div class="d"><span class="num">${dstr(t.d)}</span>${t.by?` · ✍ ${esc(t.by)}`:''}</div></div><div class="a ${t.t==='c'?(F?'owe':'due'):'ok'}">${da(t.a)}</div><button class="del" data-w onclick="K.delTx('${t.id}')" aria-label="حذف">🗑</button></div>`).join('')||'<p class="hint">ما كاين حتى حركة.</p>'}</div>
  <div style="margin-top:12px" class="row2" data-w><button class="btn l" onclick="K.editCust('${id}')">✏ بدّل الاسم / الرقم</button><button class="btn l" style="color:var(--r)" onclick="K.delCust('${id}')">${F?'🗑 حذف الفورنيسور':'🗑 حذف الزبون'}</button></div>
  </div>`;
  app.innerHTML=h;pill();
}

/* ---------- feuilles (sheets) ---------- */
function sheet(html){closeSheet();const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in">${html}</div>`;s.onclick=e=>{if(e.target===s)closeSheet()};document.body.appendChild(s);return s}
function closeSheet(){const s=$('.sheet');if(s)s.remove()}
function guard(){if(canWrite())return true;K.contact();return false}

function amountSheet(title,sub,color,cb,withName){
  let v='';
  const s=sheet(`<h3 id="st">${title}</h3><p>${sub}</p>${withName?`<div class="kd"><button type="button" class="on" data-kd="c">👤 زبون<small>يسالني</small></button><button type="button" data-kd="f" class="f">🏭 فورنيسور<small>نسالو (الديون)</small></button></div><label id="nml">اسم الزبون</label><input class="inp" id="nm" placeholder="مثلا: عمي رابح" autocomplete="off"><label>رقم التيليفون (ماشي لازم)</label><input class="inp num" id="ph" type="tel" inputmode="tel" placeholder="05 / 06 / 07…" style="text-align:right"><label id="aml">شحال الكريدي؟ (إذا ما عليه والو خلّيها 0)</label>`:''}
  <div class="amt num" id="am" style="color:${color}">0 دج</div>
  <div class="quick">${[100,200,500,1000,2000].map(x=>`<button data-q="${x}">+${x}</button>`).join('')}</div>
  <div class="pad">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>`<button class="${k==='⌫'?'x':''}" data-k="${k}">${k}</button>`).join('')}</div>
  <label>ملاحظة (ماشي لازم)</label><input class="inp" id="nt" placeholder="مثلا: خبز وحليب" autocomplete="off">
  <div class="err" id="er"></div>
  <button class="btn g" id="ok" style="background:${color};margin-top:6px">✔ سجّل</button>`);
  const show=()=>{s.querySelector('#am').textContent=(v?fmt(+v):'0')+' دج'};
  s.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')v=v.slice(0,-1);else if(v.length<8)v=(v+k).replace(/^0+/,'');show()});
  s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{v=String((+v||0)+(+b.dataset.q));show()});
  s.querySelector('#ok').onclick=()=>{const r=cb(+v||0,s.querySelector('#nt').value.trim(),s);if(r){s.querySelector('#er').textContent=r}else closeSheet()};
  if(withName){s.kd='c';s.querySelectorAll('[data-kd]').forEach(b=>b.onclick=()=>{s.kd=b.dataset.kd;const F=s.kd==='f';s.querySelectorAll('[data-kd]').forEach(x=>x.classList.toggle('on',x===b));s.querySelector('#st').textContent=F?'➕ فورنيسور جديد':title;s.querySelector('#nml').textContent=F?'اسم الفورنيسور':'اسم الزبون';s.querySelector('#nm').placeholder=F?'مثلا: موزّع الحليب':'مثلا: عمي رابح';s.querySelector('#aml').textContent=F?'شحال نسالو؟ (إذا ما نسالو والو خلّيها 0)':'شحال الكريدي؟ (إذا ما عليه والو خلّيها 0)';s.querySelector('#am').style.color=F?'#B86E00':color;s.querySelector('#ok').style.background=F?'#B86E00':color});setTimeout(()=>s.querySelector('#nm').focus(),150)}
  return s;
}

function gate(mode,msg){
  const su=mode==='signup';
  app.innerHTML=`<div class="gate"><div class="brand"><img class="lg" src="icon-192.png" alt=""><h1>الكارني</h1><p>كناش الكريدي في تيليفونك</p></div>
  ${su?`<div class="hook">«هادي خلصتك فيها» 🙄 … مع الكارني كل كريدي مكتوب بالتاريخ والساعة.</div>`:''}
  <div class="tabs" role="tablist"><button role="tab" aria-selected="${su}" onclick="K.gate('signup')">جرّب 10 أيام باطل</button><button role="tab" aria-selected="${!su}" onclick="K.gate('login')">عندي حساب</button></div>
  <div class="card"><form id="gf">
  ${su?`<label>اسمك ولا اسم المحل</label><input class="inp" id="sh" required placeholder="اكتب اسمك ولا اسم المحل تاعك" autocomplete="organization">`:''}
  <label>رقم التيليفون</label><input class="inp num" id="ph" type="tel" inputmode="tel" required placeholder="05 / 06 / 07 …" autocomplete="tel" style="text-align:right">
  <label>${su?'اختار كود سري (6 أرقام)':'الكود السري'}</label><input class="inp num" id="pw" type="password" inputmode="numeric" required minlength="6" autocomplete="${su?'new-password':'current-password'}" style="text-align:center;letter-spacing:6px">
  ${su?`<div class="hint">احفظ هذا الكود. بيه تدخل من أي تيليفون ولا PC.</div>`:''}
  <div class="err" id="er">${esc(msg||'')}</div>
  <button class="btn g" id="go" type="submit" style="margin-top:8px">${su?'🎁 ابدا التجربة باطل':'دخول'}</button>
  </form><button type="button" onclick="K.contact()" style="display:block;margin:14px auto 0;background:none;border:0;color:var(--g,#1a7f4b);font-weight:800;font-size:15px;cursor:pointer">💬 عندك سؤال؟ تواصل معنا</button></div>
  ${su?`<div class="safe"><div><i>☁</i><span><b>ما يضيع والو</b>الكريدي محفوظ في الحساب تاعك، ماشي غير في التيليفون.</span></div><div><i>📴</i><span><b>يخدم بلا أنترنت</b>تشوف وتسجّل الكريدي حتى بلا أنترنت.</span></div><div><i>🔒</i><span><b>محمي بكود سري</b>حتى واحد ما يشوف الكناش تاعك غيرك.</span></div></div>`:`<p class="hint" style="text-align:center">نسيت الكود؟ <a href="#" onclick="K.contact();return false">كلّمنا في واتساب</a> ونبدلولك.</p>`}

      const{error}=await sb.auth.signInWithPassword({email:phoneEmail(ph),password:pw});
      if(error)throw new Error(/Invalid/i.test(error.message)?'الرقم ولا الكود ماشي صحيح.':/banned/i.test(error.message)?'الحساب موقوف. كلّمنا.':'ما خدمش. تحقق من الأنترنت وعاود.');
      if(su)try{const _s=localStorage.getItem('adm_src');await sb.rpc('set_src',{s:_s?JSON.parse(_s):{direct:1}})}catch(e){}

  };

async function enter(user){
  if(USER&&USER.id===user.id)return;
  USER=user;OWNER=user.id;ME='';IS_MEMBER=false;
  try{const lk=JSON.parse(localStorage.getItem('kredi_last')||'{}');if(lk.id===user.id&&lk.owner){OWNER=lk.owner;ME=lk.name||'';IS_MEMBER=lk.owner!==user.id}}catch(e){}
  try{const{data:mm,error:me}=await sb.from('members').select('owner_id,name').eq('member_id',user.id).maybeSingle();if(!me){if(mm){OWNER=mm.owner_id;ME=mm.name||'';IS_MEMBER=true}else{OWNER=user.id;IS_MEMBER=false}}}catch(e){}
  load();
  try{const{data}=await sb.from('accounts').select('*').eq('user_id',OWNER).maybeSingle();if(data){ACC=data;localStorage.setItem(KEY()+'_acc',JSON.stringify(data))}}catch(e){}
  if(!ACC){try{ACC=JSON.parse(localStorage.getItem(KEY()+'_acc'))}catch(e){}}
  try{const{data}=await sb.rpc('get_contact');if(data)CONTACT=data}catch(e){}
  if(!D.shop.name&&ACC&&ACC.agency_name){D.shop={name:ACC.agency_name,u:1}}
  if(!IS_MEMBER)ME=(ACC&&ACC.agency_name)||'صاحب المحل';
  try{localStorage.setItem('kredi_last',JSON.stringify({id:user.id,user_metadata:user.user_metadata,owner:OWNER,name:ME}))}catch(e){}
  ROUTE={r:'home'};history.replaceState(ROUTE,'');render();sync();
  try{let dv=localStorage.getItem('adm-dev');if(!dv||!/^[a-z0-9]{8,40}$/.test(dv)){dv=(Date.now().toString(36)+Math.random().toString(36).slice(2,12)).toLowerCase();localStorage.setItem('adm-dev',dv)}sb.rpc('see_device',{d:dv}).then(()=>{},()=>{})}catch(e){}
  if(localStorage.getItem('kredi_new')){localStorage.removeItem('kredi_new');setTimeout(welcomeSheet,400)}
  else if('Notification'in window&&Notification.permission==='granted'){subscribePush().catch(()=>{})}
  else if('Notification'in window&&Notification.permission==='default'){let lt=0;try{lt=+localStorage.getItem('kr-na')||0;if(Date.now()-lt>864e5)localStorage.setItem('kr-na',String(Date.now()))}catch(e){}if(Date.now()-lt>864e5)setTimeout(()=>notifAsk(false),2500)}
  else if(window.KR_INAPP&&/Android/i.test(navigator.userAgent)){let sh=false;try{sh=sessionStorage.getItem('kr-esc2')==='1';sessionStorage.setItem('kr-esc2','1')}catch(e){}if(!sh)setTimeout(escSheet,1500)}
  try{let f=+localStorage.getItem('kr-first')||0;if(!f)localStorage.setItem('kr-first',String(Date.now()));else{const dd=(Date.now()-f)/864e5,R=[1,4,9],dn=(localStorage.getItem('kr-rem')||'').split(',');let due=null;R.forEach(x=>{if(dd>=x&&dn.indexOf(String(x))<0)due=x});if(due!==null)setTimeout(()=>{if(document.querySelector('.sheet'))return;R.forEach(x=>{if(x<=due&&dn.indexOf(String(x))<0)dn.push(String(x))});localStorage.setItem('kr-rem',dn.filter(Boolean).join(','));K.contact(true)},45000)}}catch(e){}
  try{const f0=+localStorage.getItem('kr-first')||Date.now(),lm=+localStorage.getItem('kr-mot')||0;if(!IS_MEMBER&&canWrite()&&!alive(D.tx).length&&Date.now()-f0>18e5&&Date.now()-lm>864e5&&location.hash!=='#new')setTimeout(()=>{if(document.querySelector('.sheet')||alive(D.tx).length)return;localStorage.setItem('kr-mot',String(Date.now()));motivSheet()},4000)}catch(e){}
  if(location.hash==='#new'&&canWrite()){history.replaceState(ROUTE,'',location.pathname);K.newCust()}
}

(async function boot(){
  app.innerHTML='<div class="gate" style="text-align:center;color:#5C6B62">⏳ الكارني…</div>';
  if(!window.supabase){/* hors ligne au démarrage : on ouvre le dernier carnet connu */

    app.innerHTML='<div class="gate" style="text-align:center">📴 ما كاينش أنترنت. أول مرة لازم أنترنت باش تدخل.</div>';return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((ev,session)=>{if(session&&session.user){let o={};try{o=JSON.parse(localStorage.getItem('kredi_last')||'{}')}catch(e){}localStorage.setItem('kredi_last',JSON.stringify(o.id===session.user.id?{...o,user_metadata:session.user.user_metadata}:{id:session.user.id,user_metadata:session.user.user_metadata}));setTimeout(()=>enter(session.user),0)}});
  const{data}=await sb.auth.getSession();
  if(data.session)enter(data.session.user);
  else{const last=localStorage.getItem('kredi_last');
    if(last&&!navigator.onLine){try{const u=JSON.parse(last);USER=u;OWNER=u.owner||u.id;ME=u.name||'';IS_MEMBER=OWNER!==u.id;load();try{ACC=JSON.parse(localStorage.getItem(KEY()+'_acc'))}catch(e){}render();return}catch(e){}}
    const lg=/[?&]login=1/.test(location.search);gate((last||lg)?'login':'signup',lg?'✔ دوكا دخل بالرقم والكود السري لي سجّلت بيهم (ما تعاودش تسجّل)':'')}
})();
})();
